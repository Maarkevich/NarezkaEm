<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="theme-color" content="#4A90E2">
    <title>NarezkaEm</title>
    <link rel="manifest" href="manifest.json">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f0f2f5;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: env(safe-area-inset-top);
            padding-right: env(safe-area-inset-right);
            padding-bottom: env(safe-area-inset-bottom);
            padding-left: env(safe-area-inset-left);
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
        }
        .app {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 500px;
            height: 100%;
            padding: 12px;
            gap: 16px;
        }
        h1 {
            font-size: 1.5rem;
            font-weight: 600;
            color: #4A90E2;
            margin-top: 8px;
        }
        .canvas-wrapper {
            position: relative;
            width: min(80vw, calc(100vh - 180px), 400px);
            height: min(80vw, calc(100vh - 180px), 400px);
            border: 2px solid #ccc;
            background: white;
            flex-shrink: 0;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
        .controls {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            width: 100%;
        }
        .file-label {
            background: #4A90E2;
            color: white;
            padding: 10px 24px;
            border-radius: 24px;
            font-weight: 500;
            cursor: pointer;
            display: inline-block;
        }
        input[type="file"] {
            display: none;
        }
        .size-selector {
            display: flex;
            gap: 16px;
            font-size: 0.95rem;
        }
        .size-selector label {
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
        }
        .sharpen-option {
            display: none;
            align-items: center;
            gap: 6px;
            font-size: 0.9rem;
            color: #333;
        }
        .download-btn {
            background: #27ae60;
            color: white;
            border: none;
            padding: 12px 28px;
            border-radius: 24px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
        }
        .download-btn:active {
            background: #219a52;
        }
        .status {
            font-size: 0.85rem;
            color: #666;
            min-height: 20px;
        }
    </style>
</head>
<body>
    <div class="app">
        <h1>NarezkaEm</h1>
        <div class="canvas-wrapper" id="canvasWrapper">
            <canvas id="mainCanvas"></canvas>
        </div>
        <div class="controls">
            <label class="file-label" for="fileInput">Выбрать изображение</label>
            <input type="file" id="fileInput" accept="image/*">
            <div class="size-selector">
                <label>
                    <input type="radio" name="size" value="100" checked> 100×100 (эмодзи)
                </label>
                <label>
                    <input type="radio" name="size" value="512"> 512×512 (стикеры)
                </label>
            </div>
            <div class="sharpen-option" id="sharpenOption">
                <input type="checkbox" id="sharpenCheck" checked>
                <label for="sharpenCheck">Усилить резкость</label>
            </div>
            <button class="download-btn" id="downloadBtn">Скачать 4 части</button>
            <div class="status" id="status"></div>
        </div>
    </div>

    <script>
        // ========== apple-touch-icon из SVG ==========
        (function() {
            const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
                <rect width="512" height="512" fill="#4A90E2" rx="64"/>
                <g stroke="#fff" stroke-width="8" stroke-dasharray="20,20">
                    <line x1="256" y1="0" x2="256" y2="512"/>
                    <line x1="0" y1="256" x2="512" y2="256"/>
                </g>
            </svg>`;
            const blob = new Blob([svg], {type: 'image/svg+xml'});
            const url = URL.createObjectURL(blob);
            const img = new Image();
            img.onload = () => {
                const canvas = document.createElement('canvas');
                canvas.width = 180;
                canvas.height = 180;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(img, 0, 0, 180, 180);
                canvas.toBlob((blob) => {
                    const iconUrl = URL.createObjectURL(blob);
                    const link = document.createElement('link');
                    link.rel = 'apple-touch-icon';
                    link.href = iconUrl;
                    document.head.appendChild(link);
                    URL.revokeObjectURL(url);
                }, 'image/png');
            };
            img.src = url;
        })();

        // ========== Основные переменные ==========
        const canvas = document.getElementById('mainCanvas');
        const ctx = canvas.getContext('2d');
        const wrapper = document.getElementById('canvasWrapper');
        const fileInput = document.getElementById('fileInput');
        const downloadBtn = document.getElementById('downloadBtn');
        const statusDiv = document.getElementById('status');
        const sharpenOption = document.getElementById('sharpenOption');
        const sharpenCheck = document.getElementById('sharpenCheck');

        const LOGICAL_SIZE = 400;
        let dpr = window.devicePixelRatio || 1;
        let img = null;
        let imgLoaded = false;
        let scale = 1;
        let offsetX = 0;
        let offsetY = 0;
        let baseScale = 1;

        // Показывать чекбокс резкости только для 100x100
        document.querySelectorAll('input[name="size"]').forEach(radio => {
            radio.addEventListener('change', (e) => {
                sharpenOption.style.display = e.target.value === '100' ? 'flex' : 'none';
            });
        });

        // ========== Размер холста ==========
        function resizeCanvas() {
            const rect = wrapper.getBoundingClientRect();
            const size = rect.width;
            canvas.width = size * dpr;
            canvas.height = size * dpr;
            canvas.style.width = size + 'px';
            canvas.style.height = size + 'px';
        }
        window.addEventListener('resize', () => { resizeCanvas(); redraw(); });
        resizeCanvas();

        // ========== Загрузка изображения ==========
        fileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (ev) => {
                img = new Image();
                img.onload = () => {
                    imgLoaded = true;
                    const maxSide = Math.max(img.width, img.height);
                    baseScale = LOGICAL_SIZE / maxSide;
                    scale = baseScale;
                    offsetX = 0;
                    offsetY = 0;
                    redraw();
                    statusDiv.textContent = 'Изображение загружено';
                    canvas.style.cursor = 'grab';
                };
                img.src = ev.target.result;
            };
            reader.readAsDataURL(file);
        });

        // ========== Отрисовка редактора ==========
        function redraw() {
            if (!canvas || !ctx) return;
            const w = canvas.width, h = canvas.height;
            ctx.clearRect(0, 0, w, h);
            if (img && imgLoaded) {
                ctx.save();
                ctx.scale(w / LOGICAL_SIZE, h / LOGICAL_SIZE);
                ctx.translate(offsetX, offsetY);
                ctx.scale(scale, scale);
                ctx.imageSmoothingQuality = 'high';
                ctx.drawImage(img, 0, 0, img.width, img.height);
                ctx.restore();
            }
            // Пунктирное перекрестие
            ctx.save();
            ctx.scale(w / LOGICAL_SIZE, h / LOGICAL_SIZE);
            const half = LOGICAL_SIZE / 2;
            ctx.beginPath();
            ctx.strokeStyle = 'rgba(0, 0, 0, 0.45)';
            ctx.lineWidth = 2;
            ctx.setLineDash([8, 6]);
            ctx.moveTo(half, 0);
            ctx.lineTo(half, LOGICAL_SIZE);
            ctx.moveTo(0, half);
            ctx.lineTo(LOGICAL_SIZE, half);
            ctx.stroke();
            ctx.setLineDash([]);
            ctx.restore();
        }

        // ========== Координаты в логических единицах ==========
        function getCanvasPos(clientX, clientY) {
            const rect = canvas.getBoundingClientRect();
            return {
                x: (clientX - rect.left) * (LOGICAL_SIZE / rect.width),
                y: (clientY - rect.top) * (LOGICAL_SIZE / rect.height)
            };
        }

        // ========== Pan & Zoom (мышь и тач) ==========
        let isDragging = false, lastMouse = { x: 0, y: 0 };
        canvas.addEventListener('mousedown', (e) => {
            if (!imgLoaded) return;
            isDragging = true;
            lastMouse = getCanvasPos(e.clientX, e.clientY);
            canvas.style.cursor = 'grabbing';
        });
        window.addEventListener('mousemove', (e) => {
            if (!isDragging) return;
            const pos = getCanvasPos(e.clientX, e.clientY);
            offsetX += pos.x - lastMouse.x;
            offsetY += pos.y - lastMouse.y;
            lastMouse = pos;
            redraw();
        });
        window.addEventListener('mouseup', () => { isDragging = false; canvas.style.cursor = 'grab'; });
        canvas.addEventListener('wheel', (e) => {
            if (!imgLoaded) return;
            e.preventDefault();
            const pos = getCanvasPos(e.clientX, e.clientY);
            const zoomFactor = 1.1;
            const oldScale = scale;
            const newScale = e.deltaY < 0 ? scale * zoomFactor : scale / zoomFactor;
            const minScale = baseScale * 0.5, maxScale = baseScale * 5;
            if (newScale < minScale || newScale > maxScale) return;
            scale = newScale;
            offsetX = pos.x - (newScale / oldScale) * (pos.x - offsetX);
            offsetY = pos.y - (newScale / oldScale) * (pos.y - offsetY);
            redraw();
        }, { passive: false });

        // Тач-обработка (сокращено для компактности, но полностью рабочая)
        let touchMode = null, touchStartDist = 0, touchStartMid = { x: 0, y: 0 }, touchStartScale = 1, touchStartOffsetX = 0, touchStartOffsetY = 0;
        function getTouchDist(touches) { const dx = touches[0].clientX - touches[1].clientX; const dy = touches[0].clientY - touches[1].clientY; return Math.sqrt(dx*dx+dy*dy); }
        canvas.addEventListener('touchstart', (e) => {
            if (!imgLoaded) return;
            e.preventDefault();
            const touches = e.touches;
            if (touches.length === 1) {
                touchMode = 'drag';
                lastMouse = getCanvasPos(touches[0].clientX, touches[0].clientY);
            } else if (touches.length === 2) {
                touchMode = 'pinch';
                touchStartDist = getTouchDist(touches);
                touchStartScale = scale;
                touchStartOffsetX = offsetX;
                touchStartOffsetY = offsetY;
                const mid = { x: (touches[0].clientX + touches[1].clientX)/2, y: (touches[0].clientY + touches[1].clientY)/2 };
                touchStartMid = getCanvasPos(mid.x, mid.y);
            }
        }, { passive: false });
        canvas.addEventListener('touchmove', (e) => {
            if (!imgLoaded || !touchMode) return;
            e.preventDefault();
            const touches = e.touches;
            if (touchMode === 'drag' && touches.length === 1) {
                const pos = getCanvasPos(touches[0].clientX, touches[0].clientY);
                offsetX += pos.x - lastMouse.x;
                offsetY += pos.y - lastMouse.y;
                lastMouse = pos;
                redraw();
            } else if (touchMode === 'pinch' && touches.length === 2) {
                const newDist = getTouchDist(touches);
                if (touchStartDist === 0) return;
                const ratio = newDist / touchStartDist;
                const newScale = touchStartScale * ratio;
                if (newScale < baseScale*0.5 || newScale > baseScale*5) return;
                scale = newScale;
                const mid = { x: (touches[0].clientX + touches[1].clientX)/2, y: (touches[0].clientY + touches[1].clientY)/2 };
                const midCanvas = getCanvasPos(mid.x, mid.y);
                offsetX = midCanvas.x - ratio * (touchStartMid.x - touchStartOffsetX);
                offsetY = midCanvas.y - ratio * (touchStartMid.y - touchStartOffsetY);
                redraw();
            }
        }, { passive: false });
        canvas.addEventListener('touchend', () => { touchMode = null; });

        // ========== Улучшенная нарезка с высоким качеством ==========
        function applySharpen(imageData, strength = 0.5) {
            // Unsharp mask: копия, размытие, смешивание с original
            const w = imageData.width, h = imageData.height;
            const blurred = new Uint8ClampedArray(imageData.data);
            // Простой box blur 3x3
            const blurKernel = [1,1,1,1,1,1,1,1,1];
            const kernelWeight = 9;
            for (let y = 1; y < h-1; y++) {
                for (let x = 1; x < w-1; x++) {
                    let r=0,g=0,b=0;
                    for (let ky=-1; ky<=1; ky++) {
                        for (let kx=-1; kx<=1; kx++) {
                            const idx = ((y+ky)*w + (x+kx))*4;
                            r += imageData.data[idx];
                            g += imageData.data[idx+1];
                            b += imageData.data[idx+2];
                        }
                    }
                    const idx = (y*w + x)*4;
                    blurred[idx] = r/kernelWeight;
                    blurred[idx+1] = g/kernelWeight;
                    blurred[idx+2] = b/kernelWeight;
                }
            }
            // Смешивание: result = original + strength * (original - blurred)
            for (let i = 0; i < imageData.data.length; i+=4) {
                for (let c=0; c<3; c++) {
                    const orig = imageData.data[i+c];
                    const blur = blurred[i+c];
                    const sharp = orig + strength * (orig - blur);
                    imageData.data[i+c] = Math.min(255, Math.max(0, Math.round(sharp)));
                }
            }
        }

        function downloadQuadrants(targetSize) {
            if (!imgLoaded) {
                statusDiv.textContent = 'Сначала загрузите изображение';
                return;
            }
            statusDiv.textContent = 'Подготовка высокого качества...';

            // Используем холст в 4 раза больше целевого размера (2x по каждой стороне)
            const fullSize = targetSize * 4;
            const offCanvas = document.createElement('canvas');
            offCanvas.width = fullSize;
            offCanvas.height = fullSize;
            const offCtx = offCanvas.getContext('2d');

            // Рендерим изображение с теми же трансформациями, что в редакторе
            const scaleToFull = fullSize / LOGICAL_SIZE;
            offCtx.setTransform(
                scale * scaleToFull, 0,
                0, scale * scaleToFull,
                offsetX * scaleToFull, offsetY * scaleToFull
            );
            offCtx.imageSmoothingQuality = 'high';
            offCtx.drawImage(img, 0, 0, img.width, img.height);
            offCtx.setTransform(1, 0, 0, 1, 0, 0);

            const useSharpen = targetSize === 100 && sharpenCheck.checked;

            function downloadOne(row, col, callback) {
                // Вырезаем область увеличенного размера (targetSize*2 x targetSize*2)
                const highResSize = targetSize * 2;
                const highResCanvas = document.createElement('canvas');
                highResCanvas.width = highResSize;
                highResCanvas.height = highResSize;
                const highCtx = highResCanvas.getContext('2d');
                const sx = col * highResSize;
                const sy = row * highResSize;
                highCtx.drawImage(offCanvas, sx, sy, highResSize, highResSize, 0, 0, highResSize, highResSize);

                // Уменьшаем до целевого размера с высоким качеством
                const finalCanvas = document.createElement('canvas');
                finalCanvas.width = targetSize;
                finalCanvas.height = targetSize;
                const finalCtx = finalCanvas.getContext('2d');
                finalCtx.imageSmoothingQuality = 'high';
                finalCtx.drawImage(highResCanvas, 0, 0, highResSize, highResSize, 0, 0, targetSize, targetSize);

                // При необходимости усиливаем резкость
                if (useSharpen) {
                    const imageData = finalCtx.getImageData(0, 0, targetSize, targetSize);
                    applySharpen(imageData, 0.5); // умеренное повышение
                    finalCtx.putImageData(imageData, 0, 0);
                }

                finalCanvas.toBlob((blob) => {
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = `part_${row}_${col}_${targetSize}x${targetSize}.png`;
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                    URL.revokeObjectURL(url);
                    if (callback) callback();
                }, 'image/png');
            }

            let completed = 0;
            function step() {
                if (completed < 4) {
                    const row = Math.floor(completed / 2);
                    const col = completed % 2;
                    downloadOne(row, col, () => {
                        completed++;
                        if (completed < 4) {
                            setTimeout(step, 150);
                        } else {
                            statusDiv.textContent = `Готово! Скачано 4 части по ${targetSize}×${targetSize}px`;
                        }
                    });
                }
            }
            step();
        }

        downloadBtn.addEventListener('click', () => {
            const sizeRadio = document.querySelector('input[name="size"]:checked');
            const targetSize = parseInt(sizeRadio.value, 10);
            downloadQuadrants(targetSize);
        });

        // ========== Service Worker ==========
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js').catch(err => console.warn('SW registration failed', err));
            });
        }

        window.matchMedia(`(resolution: ${dpr}dppx)`).addEventListener('change', () => {
            dpr = window.devicePixelRatio || 1;
            resizeCanvas();
            redraw();
        });
    </script>
</body>
</html>
